# Test datasource is provided dynamically by @ServiceConnection (Testcontainers).
# Only non-datasource properties are listed here.
spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Fresh Testcontainers DB has no pre-existing tables — no baseline needed.
    baseline-on-migrate: false

  jackson:
    time-zone: UTC

  mvc:
    problemdetails:
      enabled: true
