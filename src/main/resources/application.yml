spring:
  application:
    name: appointment-scheduler

  datasource:
    url: jdbc:postgresql://localhost:5432/scheduler
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  jackson:
    time-zone: UTC

  mvc:
    problemdetails:
      enabled: true
